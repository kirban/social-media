env: local
log_level: debug
app_db:
  host: sm-db
  port: 5432
  database: social_media_db
  ssl_mode: disable
  replicas:
    - host: sm-db-sl1
      port: 5432
    - host: sm-db-sl2
      port: 5432
app_server:
  host: 0.0.0.0
  port: 8080
  # Origins allowed to call the API and open a WebSocket directly from a
  # browser. Not needed when the frontend is reached through the Vite dev
  # proxy, which is same-origin; these cover hitting this backend directly.
  cors_allowed_origins:
    - http://localhost:5173
  ws_allowed_origins:
    - localhost:5173
nats:
  url: nats://sm-nats:4222
  stream: POSTS
  subject_prefix: posts
  max_age: 10m
  publish_retries: 3