env: local
log_level: debug
app_db:
  host: localhost
  port: 5432
  database: social_media_db
  ssl_mode: disable
  # replicas:
  #   - host: replica1
  #     port: 5432
  #   - host: replica2
  #     port: 5432
app_server:
  host: localhost
  port: 8080
nats:
  url: nats://localhost:4222
  stream: POSTS
  subject_prefix: posts
  max_age: 10m
  publish_retries: 3