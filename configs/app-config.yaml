env: local
log_level: debug
app_db:
  host: localhost
  port: 5432
  database: social_media_db
  ssl_mode: disable
  # replicas:
  #   - host: replica1
  #     port: 5432
  #   - host: replica2
  #     port: 5432
app_server:
  host: localhost
  port: 8080
  # Origins allowed to call the API and open a WebSocket from a browser.
  # The Vite dev server proxies to this backend, so local development is
  # same-origin and needs neither; these cover hitting the API directly.
  cors_allowed_origins:
    - http://localhost:5173
  ws_allowed_origins:
    - localhost:5173
nats:
  url: nats://localhost:4222
  stream: POSTS
  subject_prefix: posts
  max_age: 10m
  publish_retries: 3