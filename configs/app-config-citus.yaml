env: local
log_level: debug
app_db:
  # The application talks ONLY to the Citus coordinator. The coordinator
  # transparently routes/parallelizes queries to the worker shards, so there
  # is no read-replica list here — Citus does the fan-out itself.
  host: citus-coordinator
  port: 5432
  database: social_media_db
  ssl_mode: disable
app_server:
  host: 0.0.0.0
  port: 8080
nats:
  url: nats://sm-nats:4222
  stream: POSTS
  subject_prefix: posts
  max_age: 10m
  publish_retries: 3
