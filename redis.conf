# Shared config for every node of the local Redis Cluster
# (deployments/docker-compose-in-memory-db.yaml mounts this into all 3 nodes).

port 6379

# Cluster mode. nodes.conf is written into `dir`, which is a per-node volume,
# so each container keeps its own cluster identity across restarts.
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000

# Advertise stable Docker service names rather than container IPs. Compose
# reassigns IPs whenever the network is recreated, which otherwise leaves the
# persisted nodes.conf pointing at addresses that no longer exist — nodes show
# up as "noaddr, disconnected" and every key in their slot range fails to dial.
# Each node passes its own --cluster-announce-hostname on the command line.
cluster-preferred-endpoint-type hostname

# No bind directive + no password means protected-mode would refuse every
# connection that is not loopback, including the app container's.
protected-mode no

dir /data
appendonly yes
appendfsync everysec
save ""
