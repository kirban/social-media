worker_processes auto;

worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;

  # Тюнинг таймаутов для HA. Быстро закрываем мертвые соединения.
  keepalive_timeout  65;
  keepalive_requests 10000; # Большой пул для переиспользования TCP-соединений
  client_body_timeout 10;
  send_timeout 10;

  # Буферы (защита от ошибок с большими заголовками / телом запроса)
  client_max_body_size 20m;
  client_body_buffer_size 128k;



  upstream gateway_backend {
    server sm-gateway:8080;
    keepalive 64;
  }

  server {
    listen 80;
    server_name localhost;

    # Отключаем логирование успешных запросов ради экономии I/O диска под нагрузкой
    access_log off; 
    error_log /var/log/nginx/error.log crit;

    location / {
      proxy_pass http://gateway_backend;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;

      # Передача реальных IP-адресов клиентов вашему шлюзу
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # --- НАСТРОЙКИ ВЫСОКОЙ ДОСТУПНОСТИ (HA) ПРИ ОШИБКАХ BACKEND ---
      # Если реплика выдает ошибку, NGINX мгновенно передаст запрос следующей реплике
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
      # Ограничиваем время на попытки (чтобы клиент не ждал долго, если легли все)
      proxy_next_upstream_timeout 2s;
      proxy_next_upstream_tries 3;

      # Тайм-ауты самого соединения с бэкендом
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }
  }
}