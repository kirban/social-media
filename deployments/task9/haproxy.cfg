global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m

frontend pg_replicas_front
    bind *:5001
    mode tcp
    default_backend pg_replicas_back

backend pg_replicas_back
    mode tcp
    balance roundrobin

    server sm-db-sl1 sm-db-sl1:5432 check inter 3s rise 2 fall 3
    server sm-db-sl2 sm-db-sl2:5432 check inter 3s rise 2 fall 3
